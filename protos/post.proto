syntax = "proto3";

package post;

message Post {
  string id = 1;
  string title = 2;
  string description = 3;
  string userId = 4;
}

message CreatePostRequest {
  string title = 1;
  string description = 2;
  string userId = 3;
}

message PostIdRequest {
  string id = 1;
}

message Empty {}

message PostList {
  repeated Post posts = 1;
}

message PostResponse {
  bool success = 1;
  string message = 2;
  Post post = 3;
}

service PostService {
  rpc CreatePost (CreatePostRequest) returns (PostResponse);
  rpc GetPostById (PostIdRequest) returns (PostResponse);
  rpc GetAllPosts (Empty) returns (PostList);
}
