syntax = "proto3";

package auth;

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message VerifyRequest {
  string token = 1;
}

message AuthResponse {
  bool success = 1;
  string message = 2;
  string token = 3;
  User user = 4;
}

message VerifyResponse {
  bool valid = 1;
  string message = 2;
  User user = 3;
}

service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc Verify (VerifyRequest) returns (VerifyResponse);
}
